name: template

# Une instance + Redis : etat du marche, journal des cotations et rejeu complet des bids.
# Pour deux instances derriere un proxy sticky : docker compose -f compose.scale.yml up --build

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 10

  app:
    build: .
    ports:
      - "3009:3009"
    environment:
      PORT: "3009"
      REDIS_URL: redis://redis:6379
      # Cle partagee facultative ici : une seule instance signe et verifie ses propres jetons.
      # Sans valeur, une cle aleatoire est tiree au demarrage et les anciens jetons expirent.
      JWT_SECRET: ${JWT_SECRET:-}
    command:
      - sh
      - -c
      - |
        export JWT_SECRET="$${JWT_SECRET:-$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')}"
        exec ./node_modules/.bin/tsx src/server.ts
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
