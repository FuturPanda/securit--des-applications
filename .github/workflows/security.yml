name: security
on: [push, pull_request]

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep ERROR scan
        id: scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.145.0 \
            semgrep scan --config=p/ci --config=.semgrep/ --severity ERROR \
              --metrics=off --sarif --output=semgrep.sarif --error src
      - name: Publish Semgrep findings
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate — ERROR findings or scanner failure
        if: always()
        run: |
          test -s semgrep.sarif || { echo '::error::Semgrep produced no SARIF'; exit 1; }
          count=$(jq '[.runs[].results[]] | length' semgrep.sarif)
          if [ "$count" -gt 0 ]; then echo "::error::Semgrep ERROR findings: $count"; exit 1; fi
          test '${{ steps.scan.outcome }}' = success || { echo '::error::Semgrep failed without findings'; exit 1; }

  dependencies:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (high and critical block; moderate reported)
        id: scan
        continue-on-error: true
        run: npm audit --audit-level=high --json > audit.json
      - name: Save dependency report
        if: always() && hashFiles('audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: audit.json
      - name: Gate — high/critical dependencies or scanner failure
        if: always()
        run: |
          test -s audit.json || { echo '::error::npm audit produced no report'; exit 1; }
          node -e 'let r=require("./audit.json"); let v=r.metadata?.vulnerabilities; if(!v)process.exit(2); console.log("Moderate:",v.moderate,"High:",v.high,"Critical:",v.critical); process.exit(v.high+v.critical>0?1:0)'
          test '${{ steps.scan.outcome }}' = success || { echo '::error::npm audit failed without high/critical findings'; exit 1; }

  aube-audit:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: aube
      - name: Aube audit (high and critical block)
        id: scan
        continue-on-error: true
        run: aube audit --audit-level high --json > aube-audit.json
      - name: Save Aube report
        if: always() && hashFiles('aube-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aube-audit
          path: aube-audit.json
      - name: Gate — high/critical Aube advisories or scanner failure
        if: always()
        run: |
          test -s aube-audit.json || { echo '::error::Aube produced no report'; exit 1; }
          jq -e '.metadata.vulnerabilities as $v | ($v.high | type == "number") and ($v.critical | type == "number") and ($v.high + $v.critical == 0)' aube-audit.json
          test '${{ steps.scan.outcome }}' = success || { echo '::error::Aube audit failed'; exit 1; }

  osv-scanner:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: OSV scan of committed npm lockfile (any finding blocks)
        id: scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/google/osv-scanner:v2.5.1 \
            scan --format=json --lockfile=package-lock.json > osv.json
      - name: Save OSV report
        if: always() && hashFiles('osv.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner
          path: osv.json
      - name: Gate — OSV findings or scanner failure
        if: always()
        run: |
          test -s osv.json || { echo '::error::OSV produced no report'; exit 1; }
          jq -e '(.results // [] | type == "array")' osv.json
          test '${{ steps.scan.outcome }}' = success || { echo '::error::OSV found advisories or failed to scan'; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full history
        id: scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --no-banner --redact --report-format json --report-path gitleaks.json .
      - name: Save secret report
        if: always() && hashFiles('gitleaks.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks
          path: gitleaks.json
      - name: Gate — detected secrets or scanner failure
        if: always()
        run: |
          test -s gitleaks.json || { echo '::error::Gitleaks produced no report'; exit 1; }
          count=$(jq 'length' gitleaks.json)
          if [ "$count" -gt 0 ]; then echo "::error::Gitleaks findings: $count"; exit 1; fi
          test '${{ steps.scan.outcome }}' = success || { echo '::error::Gitleaks failed without findings'; exit 1; }

  sbom:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build --pull -t cotations:ci .
      - name: Trivy CycloneDX SBOM
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: cotations:ci
          format: cyclonedx
          output: sbom.cdx.json
      - name: Save SBOM
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Gate — missing SBOM or generator failure
        if: always()
        run: |
          test -s sbom.cdx.json || { echo '::error::Trivy produced no SBOM'; exit 1; }
          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' sbom.cdx.json > /dev/null \
            || { echo '::error::SBOM is not a CycloneDX document with components'; exit 1; }
          echo "Components: $(jq '(.components // []) | length' sbom.cdx.json)"
          test '${{ steps.scan.outcome }}' = success || { echo '::error::Trivy SBOM generation failed'; exit 1; }

  dast:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for application
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3009/api/instruments > /dev/null; then exit 0; fi
            sleep 2
          done
          echo '::error::Application never answered on port 3009'
          docker compose logs --no-color
          exit 1
      - name: ZAP baseline scan
        id: scan
        continue-on-error: true
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://127.0.0.1:3009 -m 2 -I -J zap.json -r zap.html
      - name: Save DAST report
        if: always() && hashFiles('zap-out/zap.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: zap-out
      - name: Gate — high risk DAST alerts or scanner failure
        if: always()
        run: |
          test -s zap-out/zap.json || { echo '::error::ZAP produced no report'; exit 1; }
          jq -r '[.site[].alerts[]] | group_by(.riskcode)[] | "riskcode \(.[0].riskcode): \(length)"' zap-out/zap.json
          count=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' zap-out/zap.json)
          if [ "$count" -gt 0 ]; then echo "::error::ZAP high risk alerts: $count"; exit 1; fi
          test '${{ steps.scan.outcome }}' = success || { echo '::error::ZAP failed without high risk alerts'; exit 1; }
      - name: Stop application
        if: always()
        run: docker compose down -v

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build --pull -t cotations:ci .
      - name: Trivy HIGH/CRITICAL scan
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: cotations:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: '1'
      - name: Publish image findings
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Gate — HIGH/CRITICAL image findings or scanner failure
        if: always()
        run: |
          test -s trivy-image.sarif || { echo '::error::Trivy produced no SARIF'; exit 1; }
          count=$(jq '[.runs[].results[]] | length' trivy-image.sarif)
          if [ "$count" -gt 0 ]; then echo "::error::Trivy HIGH/CRITICAL findings: $count"; exit 1; fi
          test '${{ steps.scan.outcome }}' = success || { echo '::error::Trivy failed without findings'; exit 1; }
