defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

frontend web
  bind *:3009
  default_backend workers

backend workers
  balance roundrobin
  # Separate cookie jars by hostname; pin each demo tab to a different worker.
  use-server a if { hdr(host) -i localhost:3009 }
  use-server b if { hdr(host) -i 127.0.0.1:3009 }
  http-response set-header X-Demo-Worker %[srv_name]
  cookie SERVER insert indirect nocache httponly
  option httpchk GET /api/instruments
  server a app-a:3009 check cookie a
  server b app-b:3009 check cookie b
