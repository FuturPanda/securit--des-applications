defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

frontend web
  bind *:3009
  default_backend workers

backend workers
  balance roundrobin
  cookie SERVER insert indirect nocache httponly
  option httpchk GET /api/instruments
  server a app-a:3009 check cookie a
  server b app-b:3009 check cookie b
